name: AI Procurement Plan (BOM budget + purchase plan, private)

# Runs the BOM/budget engine and the purchase planner against the live ERP.
# All per-item/per-budget detail is written to git-ignored JSON and leaves the
# runner ONLY as a private workflow artifact. Public log shows aggregate
# counts and rupee totals only — never item codes, names, vendors or rates.

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Mondays 04:00 UTC (09:30 IST) — after the daily price refresh
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests

      - name: BOM / budget analysis (all open budgets)
        env:
          DEPL_CLIENT_ID: ${{ secrets.DEPL_CLIENT_ID }}
          DEPL_CLIENT_SECRET: ${{ secrets.DEPL_CLIENT_SECRET }}
        run: python3 scripts/bom_engine.py

      - name: Purchase plan + alerts
        run: python3 scripts/purchase_planner.py

      - name: Vendor scores (fills the dashboard leaderboard)
        env:
          DEPL_CLIENT_ID: ${{ secrets.DEPL_CLIENT_ID }}
          DEPL_CLIENT_SECRET: ${{ secrets.DEPL_CLIENT_SECRET }}
        run: python3 scripts/vendor_intel.py || echo "vendor scoring failed - leaderboard stays empty this run"

      - name: Render private executive dashboard
        run: python3 scripts/render_procurement_dashboard.py


      - name: Publish password-protected dashboard to the site (needs DASHBOARD_PASSWORD secret)
        env:
          DASH_PASS: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$DASH_PASS" ]; then
            echo "DASHBOARD_PASSWORD secret not set - skipping encrypted publish (artifact only)."
            exit 0
          fi
          npx -y staticrypt@3 data/procurement_dashboard.html -p "$DASH_PASS" -d enc --short \
            --template-title "Dynalektric - Procurement Dashboard" \
            --template-instructions "Enter the team password to open the live procurement dashboard."
          mv enc/procurement_dashboard.html docs/dashboard.html
          git config user.name "dynalektric-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dashboard.html
          git diff --cached --quiet || git commit -m "Update password-protected dashboard: $(date -u +%Y-%m-%d %H:%M)"
          git pull --rebase origin main || true
          git push

      - name: Prepare alert email body
        id: planalerts
        run: |
          python3 - << 'PY'
          import json
          d = json.load(open("data/purchase_plan.json"))
          alerts = d.get("alerts", [])
          if not alerts:
              open("plan_alerts.txt", "w").write("")
          else:
              lines = [f"Procurement plan alerts ({len(alerts)}):", ""]
              for a in alerts[:40]:
                  who = a.get("item_code") or a.get("budget_number") or ""
                  lines.append(f"- [{a.get('type')}] {who}: {a.get('detail')}")
              sa = d.get("summary_by_action", {})
              lines += ["", "Plan summary:"]
              for k, v in sa.items():
                  lines.append(f"  {k}: {v.get('lines')} lines, ~Rs {v.get('expected_spend_inr', 0):,.0f}")
              lines += ["", "Full detail: private artifact 'procurement-plan' of this run, and the password-protected dashboard on the site."]
              open("plan_alerts.txt", "w").write("\n".join(lines))
          PY
          if [ -s plan_alerts.txt ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Email plan alerts (needs MAIL_* secrets)
        if: steps.planalerts.outputs.has == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Dynalektric procurement alerts — weekly plan"
          from: Dynalektric Price Intel <${{ secrets.MAIL_USERNAME }}>
          to: ars@dynalektric.com
          body: file://plan_alerts.txt

      - name: Upload results (PRIVATE artifact — never published)
        uses: actions/upload-artifact@v4
        with:
          name: procurement-plan-${{ github.run_id }}
          path: |
            data/bom_analysis.json
            data/purchase_plan.json
            data/vendor_scores.json
            data/procurement_dashboard.html
          retention-days: 30
