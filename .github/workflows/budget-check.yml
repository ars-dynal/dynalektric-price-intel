name: Budget / Max Purchase Limit check (ERP, private)

# For every budget, flags metal raw-material lines whose budgeted rate is below
# today's live metal price (under-costed max purchase limits). Output carries
# budget numbers / vendor rates and is uploaded as a PRIVATE artifact only,
# never committed. Public log shows aggregate counts only.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run budget / max-purchase-limit check
        env:
          DEPL_CLIENT_ID: ${{ secrets.DEPL_CLIENT_ID }}
          DEPL_CLIENT_SECRET: ${{ secrets.DEPL_CLIENT_SECRET }}
        run: python3 scripts/budget_check.py
      - name: Upload result (private artifact - not published)
        uses: actions/upload-artifact@v4
        with:
          name: budget-check
          path: data/budget_check.json
          retention-days: 90
