name: Daily public price refresh

on:
  schedule:
    # 03:30 UTC = 9:00 AM IST daily
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pypdf

      - name: Fetch public NALCO/LME prices
        # Never let a source-site hiccup keep the whole site stale: if the
        # fetch fails, continue and re-render with the last known prices
        # (each card shows its own effective date, so staleness is visible).
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch_public_prices.py

      - name: Note fetch failure in the log
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning::Price fetch FAILED - rendering with last known prices. Check fetch_public_prices.py vs source sites."

      - name: Render public dashboard
        run: python3 scripts/render_public.py

      - name: Append today's prices to the monthly history store
        run: python3 scripts/update_history.py

      - name: Recompute buy-timing signals
        run: python3 scripts/buy_signals.py

      - name: Evaluate procurement alerts
        run: python3 scripts/alerts.py

      - name: Render item detail page + trend charts + signals
        run: python3 scripts/render_items.py
        
      - name: Render price-history page
        run: python3 scripts/render_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "dynalektric-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/public_summary.json data/price_history.json data/buy_signals.json data/alerts.json docs/index.html docs/items.html
          git diff --cached --quiet || git commit -m "Daily public price refresh: $(date -u +%Y-%m-%d)"
          git push

      - name: Open an issue if there are new alerts
        id: alerts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s data/new_alerts.md ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            gh issue create \
              --title "Price alert — $(date -u +%Y-%m-%d)" \
              --body-file data/new_alerts.md \
              --repo "${GITHUB_REPOSITORY}" || echo "issue creation skipped/failed"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "No new alerts."
          fi

      - name: Email alerts to procurement (needs MAIL_* secrets)
        if: always() && steps.alerts.outputs.has == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Dynalektric price alert — ${{ github.run_started_at }}"
          from: Dynalektric Price Intel <${{ secrets.MAIL_USERNAME }}>
          to: ars@dynalektric.com
          body: file://data/new_alerts.md
