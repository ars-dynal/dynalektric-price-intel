name: Discover DEPL ERP response schema (field names only, no values)

# Manually triggered only. Fetches ONE sample record from a few endpoints and
# prints ONLY the field names (dict keys), never the actual values — this
# repo is public and its Action logs are publicly visible, so no real
# item/budget/vendor/price value should ever be echoed here. This step exists
# purely to learn the API's response shape before writing real parsing logic.
#
# Response shape observed so far: {"success": true, "data": {<Laravel
# paginator>: current_page, data: [...actual records...], total, ...}}

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Get token and inspect field names only
        env:
          DEPL_CLIENT_ID: ${{ secrets.DEPL_CLIENT_ID }}
          DEPL_CLIENT_SECRET: ${{ secrets.DEPL_CLIENT_SECRET }}
        run: |
          python3 -m pip install --quiet requests
          python3 - <<'PYEOF'
          import requests, json, os

          BASE = "https://depl.consult-trico.com"
          cid = os.environ["DEPL_CLIENT_ID"]
          secret = os.environ["DEPL_CLIENT_SECRET"]

          tok = requests.post(f"{BASE}/oauth/token", json={
              "grant_type": "client_credentials", "client_id": cid, "client_secret": secret
          }, timeout=20)
          tok.raise_for_status()
          access_token = tok.json()["access_token"]
          headers = {"Authorization": f"Bearer {access_token}", "Accept": "application/json"}

          def key_names(v, depth=0, max_depth=2):
              """Recursively describe structure using ONLY key names / types, never values."""
              indent = "  " * depth
              if isinstance(v, dict):
                  for k, val in v.items():
                      if isinstance(val, (dict, list)) and depth < max_depth:
                          print(f"{indent}{k}: {type(val).__name__}")
                          key_names(val, depth + 1, max_depth)
                      else:
                          print(f"{indent}{k}: {type(val).__name__}")
              elif isinstance(v, list):
                  if v:
                      print(f"{indent}[0]:")
                      key_names(v[0], depth + 1, max_depth)
                  else:
                      print(f"{indent}(empty list)")

          def describe(name, path, params=None):
              print(f"\n=== {name} ({path}) ===")
              try:
                  r = requests.get(f"{BASE}{path}", headers=headers, params=params or {"per_page": 2}, timeout=20)
                  print(f"HTTP status: {r.status_code}")
                  if r.status_code != 200:
                      print("(non-200, skipping schema dump)")
                      return
                  body = r.json()
                  paginator = body.get("data") if isinstance(body, dict) else None
                  if isinstance(paginator, dict) and isinstance(paginator.get("data"), list):
                      records = paginator["data"]
                      print(f"total (per paginator): {paginator.get('total')}, per_page: {paginator.get('per_page')}, records on this page: {len(records)}")
                      if records:
                          print("First record structure (key names + value TYPES only, no actual values):")
                          key_names(records[0])
                      else:
                          print("No records returned (empty data set) — cannot infer field names from this endpoint right now.")
                  else:
                      print("Unexpected shape — top-level keys:", sorted(body.keys()) if isinstance(body, dict) else type(body))
              except Exception as e:
                  print(f"Error describing {name}: {type(e).__name__}: {e}")

          describe("Items", "/api/external/items")
          describe("Budgets", "/api/external/budgets")
          describe("Purchase Orders", "/api/external/purchase-orders")
          describe("Inventory", "/api/external/inventory")
          describe("BOMs", "/api/external/boms")
          describe("Vendors", "/api/external/vendors")
          PYEOF
